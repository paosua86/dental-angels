name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, cancela el despliegue viejo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v5

      # enablement: true activa Pages y lo pone en modo "GitHub Actions"
      # por API. Sin esto, el primer push falla con "Get Pages site failed"
      # porque el workflow corre antes de que Pages exista.
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Sitio estático sin build: se sube el repo entero tal cual.
      # El .nojekyll evita que GitHub procese los archivos con Jekyll.
      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
